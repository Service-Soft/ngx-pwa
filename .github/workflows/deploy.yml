name: Deploy

on:
    pull_request:
        types: [closed]
        branches:
            - release

permissions:
    id-token: write  # Required for OIDC
    contents: read

jobs:
    build:
        if: github.event.pull_request.merged
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: "dev"
            - uses: actions/setup-node@v4
              with:
                node-version: '24'
                registry-url: 'https://registry.npmjs.org'
            - run: npm i
            - run: npm run build:prod
            - run: |
                  cd dist/ngx-pwa
                  npm publish
